name: Release

on:
  push:
    tags:
      - mru/v*
      - sounds/v*
      - fog/v*
  workflow_dispatch:
    inputs:
      tag:
        description: tag
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: monorepo-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            sounds/v*|mru/v*|fog/v*) ;;
            *) echo 'Expected a sounds/v, mru/v or fog/v release tag'; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "RELEASE_MOD=${RELEASE_TAG%%/*}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and publish selected mods
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_MOD" in
            mru|sounds|fog) task=":$RELEASE_MOD:publishMods" ;;
            *) exit 1 ;;
          esac
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_SHA="$(git rev-parse HEAD)" bash ./gradlew --no-daemon --build-cache "$task"
